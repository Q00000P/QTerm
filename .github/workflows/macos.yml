name: macos

# Мак-версия: проверка сборки на каждый пуш (swift build + make-app.sh) и QTerm.app в артефакты.
# Подпись в CI — ad-hoc: для ежедневной работы собирай у себя ./make-app.sh (серт «QTerm Self-Signed»),
# иначе Keychain/Touch ID вейлта не узнают приложение.
on:
  push:
    branches: [main, 'mac-*']
    paths-ignore: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: QTerm

      - name: Swift
        run: |
          ls -d /Applications/Xcode*.app
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          swift --version
          echo "::notice::$(xcodebuild -version | tr '\n' ' ') · $(swift --version 2>&1 | head -1)"

      - name: Зависимости (setup-deps.sh)
        run: ./QTerm/setup-deps.sh

      - name: Сборка (make-app.sh)
        working-directory: QTerm
        run: |
          set +e
          ./make-app.sh > build.log 2>&1
          status=$?
          tail -n 40 build.log
          # ошибки компилятора — в аннотации (их видно через API без скачивания логов)
          grep -E "error:|fatal error|Fatal error" build.log | sort -u | head -n 40 | while IFS= read -r l; do
            echo "::error::${l:0:900}"
          done
          if [ $status -ne 0 ]; then
            tail -n 15 build.log | while IFS= read -r l; do echo "::warning::${l:0:900}"; done
          fi
          exit $status

      - name: Упаковка
        id: pack
        working-directory: QTerm
        run: |
          VER=$(grep -m1 '^APP_VERSION=' make-app.sh | cut -d'"' -f2)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          ditto -c -k --keepParent build/QTerm.app "QTerm-$VER-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: QTerm-${{ steps.pack.outputs.version }}-macos-arm64
          path: QTerm/QTerm-${{ steps.pack.outputs.version }}-macos-arm64.zip
